<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Mohmmad Al Gharably - Software Engineer</title>
  <desc id="desc">Professional GitHub profile banner based on Mohmmad Al Gharably's CV</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="52%" stop-color="#0D1B2F"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="90" r="300" fill="url(#blueGlow)"/>
  <circle cx="120" cy="350" r="240" fill="url(#violetGlow)"/>

  <g transform="translate(70 52)">
    <rect width="188" height="34" rx="17" fill="#3B82F6" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="5" fill="#22C55E"/>
    <text x="36" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#DCEBFF" letter-spacing="1.1">SOFTWARE ENGINEER</text>
  </g>

  <text x="70" y="154" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Mohmmad Al Gharably</text>
  <text x="70" y="202" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#B9CCF5">Enterprise Systems • Data Analysis • Mobile &amp; Web Development</text>
  <text x="70" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9FB0CB">ASP.NET Core • Flutter • SQL Server • Power BI • Dynamics 365 ERP</text>

  <g transform="translate(70 292)">
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="52.5" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#D8E2F2">Jordan</text>

    <rect x="117" y="0" width="146" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="190" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#D8E2F2">2+ Years Experience</text>

    <rect x="275" y="0" width="182" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="366" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#D8E2F2">Business + Technology</text>
  </g>

  <g transform="translate(985 186)">
    <circle cx="0" cy="0" r="88" fill="#0B1423" stroke="#3B82F6" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="0" cy="0" r="67" fill="#111C2F" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#FFFFFF">MG</text>
  </g>
