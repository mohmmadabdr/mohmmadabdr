  </defs>
  <rect width="1200" height="220" rx="22" fill="url(#bg)"/>
  <text x="48" y="45" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Career Snapshot</text>

  <g transform="translate(48 72)" font-family="Arial,Helvetica,sans-serif">
