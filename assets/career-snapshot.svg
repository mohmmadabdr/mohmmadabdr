<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Career Snapshot</title>
  <desc id="desc">Key career metrics from Mohmmad Al Gharably's CV</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#bg)"/>
  <text x="54" y="48" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Career Snapshot</text>
  <text x="54" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94A3B8">Impact highlighted in my professional CV</text>

  <g transform="translate(54 104)">
    <g>
      <rect width="248" height="108" rx="18" fill="#111C2F" stroke="#334155"/>
      <text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#60A5FA">2+ Years</text>
      <text x="24" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CBD5E1">Software &amp; enterprise systems experience</text>
    </g>
    <g transform="translate(270 0)">
      <rect width="248" height="108" rx="18" fill="#111C2F" stroke="#334155"/>
      <text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#A78BFA">35%</text>
      <text x="24" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CBD5E1">Improvement in data accuracy</text>
    </g>
    <g transform="translate(540 0)">
      <rect width="248" height="108" rx="18" fill="#111C2F" stroke="#334155"/>
      <text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#34D399">40%</text>
      <text x="24" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CBD5E1">Reduction in manual processing time</text>
    </g>
    <g transform="translate(810 0)">
      <rect width="282" height="108" rx="18" fill="#111C2F" stroke="#334155"/>
      <text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#F59E0B">100+</text>
      <text x="24" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CBD5E1">End users supported by delivered solutions</text>
