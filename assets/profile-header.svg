<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mohmmad Al Gharably - Software Engineer</title>
  <desc id="desc">Modern GitHub profile banner for Mohmmad Al Gharably</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#111A33"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="65" r="260" fill="url(#glow1)"/>
  <circle cx="160" cy="320" r="250" fill="url(#glow2)"/>

  <g opacity="0.95">
    <circle cx="1015" cy="184" r="82" fill="#111827" stroke="#5B8CFF" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="1015" cy="184" r="62" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="1015" y="201" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">MG</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="54" width="190" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="93" cy="71" r="5" fill="#22C55E"/>
    <text x="109" y="77" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#DCE7FF" letter-spacing="1">OPEN TO BUILD</text>
  </g>

  <text x="70" y="158" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#FFFFFF">Mohmmad Al Gharably</text>
  <text x="70" y="206" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#AFC3FF">Software Engineer • .NET • Flutter • SQL</text>
  <text x="70" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#A8B3CF">Building practical software, mobile apps, and data-driven solutions.</text>

  <g transform="translate(70 286)">
    <rect x="0" y="0" width="88" height="30" rx="15" fill="#5B8CFF" fill-opacity="0.15" stroke="#5B8CFF" stroke-opacity="0.35"/>
    <text x="44" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#C7D6FF">ASP.NET</text>

    <rect x="100" y="0" width="64" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.35"/>
    <text x="132" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#D9CBFF">C#</text>

    <rect x="176" y="0" width="78" height="30" rx="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.30"/>
    <text x="215" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#BCEFFF">Flutter</text>

    <rect x="266" y="0" width="68" height="30" rx="15" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.30"/>
    <text x="300" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#C8F7D5">SQL</text>
  </g>
</svg>
