      <text x="20" y="72" font-size="13" fill="#CBD5E1">Less manual processing</text>
      <text x="20" y="90" font-size="13" fill="#CBD5E1">through automation</text>
    </g>

    <g transform="translate(825 0)">
      <rect width="279" height="105" rx="16" fill="#111C2F" stroke="#27364D"/>
      <text x="20" y="43" font-size="30" font-weight="700" fill="#F59E0B">100+</text>
      <text x="20" y="72" font-size="13" fill="#CBD5E1">End users supported by</text>
